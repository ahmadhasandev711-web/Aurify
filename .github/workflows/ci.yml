name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://aurify:aurify@localhost:5432/aurify
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: aurify
          POSTGRES_PASSWORD: aurify
          POSTGRES_DB: aurify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aurify -d aurify"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      # Action majors below were not verifiable when this file was written; Dependabot
      # (see dependabot.yml) will open a PR if a newer major exists.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
