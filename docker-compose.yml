services:
  db:
    # PostgreSQL 18 (18.6 is the latest GA as of 2026-10-28). If this exact tag is not
    # published yet, use postgres:18 and note the resolved version.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: anoofy
      POSTGRES_PASSWORD: anoofy
      POSTGRES_DB: anoofy
    ports:
      - '${ANOOFY_DB_PORT:-54329}:5432'  # host port: set ANOOFY_DB_PORT in .env if it clashes
    volumes:
      - anoofy-pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anoofy -d anoofy']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  anoofy-pg:
